<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<link rel="icon" type="image/png" href="/img/aster-icon.png" />
<meta name="robots" content="noindex" />
<title>経営ダッシュボード | Aster Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/insights.css" />
</head>
<body>

  <div id="auth-gate" class="centered-screen">
    <p class="who">確認中…</p>
  </div>

  <div id="dashboard-view" style="display:none">
    <header class="dash-header">
      <div class="brand">
        <img src="/img/aster-icon.png" alt="" />
        <span>経営ダッシュボード</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span class="who" id="who-label"></span>
        <a class="settings-btn" href="/admin/admin.html">案件一覧へ戻る</a>
        <a class="settings-btn" href="/admin/structure.html">アプリ構造ビューアー</a>
        <button class="logout-btn" id="logout-btn">ログアウト</button>
      </div>
    </header>

    <div class="dash-wrap">
      <p class="tab-help" id="data-note">案件データは直近200件まで集計しています。</p>

      <h2 class="section-title">案件状況</h2>
      <div class="stat-grid" id="status-stats"></div>

      <h2 class="section-title">売上・見積もり金額</h2>
      <div class="stat-grid" id="revenue-stats"></div>

      <h2 class="section-title">カテゴリ別内訳</h2>
      <div class="table-scroll">
        <table class="case-table" id="category-table">
          <thead>
            <tr><th>カテゴリ</th><th>件数</th><th>受注数</th><th>受注率</th></tr>
          </thead>
          <tbody id="category-tbody">
            <tr class="empty-row"><td colspan="4">読み込み中…</td></tr>
          </tbody>
        </table>
      </div>

      <h2 class="section-title">料金体系・キャンペーンの状況</h2>
      <div class="stat-grid" id="pricing-stats"></div>
    </div>
  </div>

  <div id="error-view" class="centered-screen" style="display:none">
    <div class="login-card">
      <p id="error-message" style="margin:0 0 16px;"></p>
      <a class="login-btn" href="/admin/admin.html" style="display:block;text-align:center;">管理者ログインへ</a>
    </div>
  </div>

  <script src="/js/hearing-config.js"></script>
  <script src="/js/pricing-config.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
