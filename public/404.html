<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<link rel="icon" type="image/png" href="/img/aster-icon.png" />
<meta name="robots" content="noindex" />
<title>ページが見つかりません | Aster Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/portal.css" />
<style>
  .notfound-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(56px, 10vw, 120px) clamp(16px, 4vw, 40px);
    text-align: center;
  }
  .notfound-code {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    margin: 0 0 14px;
  }
  .notfound-wrap h1 {
    font-family: var(--font-display);
    font-size: var(--step-3);
    color: var(--navy);
    margin: 0 0 14px;
  }
  .notfound-wrap p {
    color: var(--ink-soft);
    margin: 0 0 28px;
  }
  .notfound-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
</style>
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <a href="/portal.html" class="brand-link"><img src="/img/aster-icon.png" alt="" class="brand-icon" />
        <span class="brand-word">Aster<em>Systems</em></span></a>
      </div>
    </div>
  </header>

  <main class="notfound-wrap">
    <p class="notfound-code">404 NOT FOUND</p>
    <h1>お探しのページが見つかりません</h1>
    <p>URLが変更されたか、入力に誤りがある可能性があります。お手数ですが、下記よりポータルへお進みください。</p>
    <div class="notfound-actions">
      <a class="btn-primary" href="/portal.html">ポータルへ戻る</a>
      <a class="btn-ghost" href="/customer/estimate.html">見積もりシミュレーターを開く</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="foot-brand">Aster Systems — Creative &amp; System Production</span>
    </div>
  </footer>

</body>
</html>
